name: Build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Compiler SkillTree
        run: mvn -B package -f Plugins/SkillTree/pom.xml
      - name: Compiler CustomMobs
        run: mvn -B package -f Plugins/CustomMobs/pom.xml
      - name: Regrouper les jars
        run: |
          mkdir -p out
          cp Plugins/SkillTree/target/SkillTree-1.0.jar out/
          cp Plugins/CustomMobs/target/CustomMobs-1.0.jar out/
      - uses: actions/upload-artifact@v4
        with:
          name: Plugins
          path: out/*.jar
